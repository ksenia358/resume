name: Deploy to SpaceWeb FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sweb-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Check PHP syntax
        run: find dist/api -name '*.php' -print0 | xargs -0 -n1 php -l

      # config.php is generated from secrets so credentials never land in git.
      - name: Write backend config
        env:
          DB_HOST: ${{ secrets.SWEB_DB_HOST }}
          DB_NAME: ${{ secrets.SWEB_DB_NAME }}
          DB_USER: ${{ secrets.SWEB_DB_USER }}
          DB_PASSWORD: ${{ secrets.SWEB_DB_PASSWORD }}
          MAIL_TO: ${{ secrets.CONTACT_MAIL_TO }}
          MAIL_FROM: ${{ secrets.CONTACT_MAIL_FROM }}
          SMTP_HOST: ${{ secrets.CONTACT_SMTP_HOST }}
          SMTP_PASSWORD: ${{ secrets.CONTACT_SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          php -r 'file_put_contents("dist/api/config.php", "<?php\n\nreturn " . var_export([
            "db_host" => getenv("DB_HOST") ?: "localhost",
            "db_name" => getenv("DB_NAME") ?: "",
            "db_user" => getenv("DB_USER") ?: "",
            "db_password" => getenv("DB_PASSWORD") ?: "",
            "mail_to" => getenv("MAIL_TO") ?: "derievaks@gmail.com, ks-31@mail.ru",
            "mail_from" => getenv("MAIL_FROM") ?: "noreply@aceventura.ru",
            "smtp_host" => getenv("SMTP_HOST") ?: "smtp.spaceweb.ru",
            "smtp_password" => getenv("SMTP_PASSWORD") ?: "",
            "telegram_bot_token" => getenv("TELEGRAM_BOT_TOKEN") ?: "",
            "telegram_chat_id" => getenv("TELEGRAM_CHAT_ID") ?: "",
          ], true) . ";\n");'
          php -l dist/api/config.php

      - name: Upload dist to SpaceWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SWEB_FTP_SERVER }}
          username: ${{ secrets.SWEB_FTP_USERNAME }}
          password: ${{ secrets.SWEB_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.SWEB_FTP_SERVER_DIR }}
