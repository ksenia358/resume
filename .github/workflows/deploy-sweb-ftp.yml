name: Deploy to SpaceWeb FTP

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: sweb-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Upload dist to SpaceWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SWEB_FTP_SERVER }}
          username: ${{ secrets.SWEB_FTP_USERNAME }}
          password: ${{ secrets.SWEB_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.SWEB_FTP_SERVER_DIR }}
